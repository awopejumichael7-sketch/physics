<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a1533" />
  <title>Login — Scholar's Camp</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/assets/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <style>
    .auth-wrap {
      min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--navy-900), var(--navy-700) 60%, var(--royal-600));
      padding: var(--sp-4);
    }
    .auth-card {
      width: 100%; max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: var(--sp-6);
      box-shadow: var(--shadow-lg);
    }
    .auth-brand {
      display: flex; align-items: center; gap: var(--sp-3);
      margin-bottom: var(--sp-5);
    }
    .auth-tabs {
      display: flex; gap: 4px; background: var(--grey-100);
      padding: 4px; border-radius: var(--radius-md); margin-bottom: var(--sp-5);
    }
    .auth-tabs button {
      flex: 1; padding: 10px; border: none; cursor: pointer;
      background: transparent; border-radius: 9px;
      font-weight: 600; color: var(--grey-600);
      transition: all var(--transition);
    }
    .auth-tabs button.active { background: var(--white); color: var(--royal-600); box-shadow: var(--shadow-sm); }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .auth-footer { text-align: center; margin-top: var(--sp-4); font-size: .9rem; }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark" style="width:44px;height:44px;border-radius:12px;background:var(--gold-500);display:grid;place-items:center;font-weight:800;color:var(--navy-900);font-family:var(--font-display)">SC</div>
        <div>
          <div style="font-family:var(--font-display);font-weight:800;color:var(--navy-900);font-size:1.1rem">SCHOLAR'S CAMP</div>
          <div style="font-size:.75rem;color:var(--grey-600);letter-spacing:.06em;text-transform:uppercase">Physics Learning Centre</div>
        </div>
      </div>

      <div class="auth-tabs" role="tablist">
        <button type="button" data-tab="login" class="active" role="tab">Login</button>
        <button type="button" data-tab="register" role="tab">Create Account</button>
      </div>

      <!-- LOGIN PANEL -->
      <form id="login-form" class="auth-panel active" novalidate>
        <div class="field">
          <label for="login-email">Email address</label>
          <input id="login-email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">LOGIN</button>
        <div class="auth-footer">
          <a href="#" id="forgot-link">Forgot password?</a>
        </div>
      </form>

      <!-- REGISTER PANEL -->
      <form id="register-form" class="auth-panel" novalidate>
        <div class="field">
          <label for="reg-name">Full name</label>
          <input id="reg-name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="reg-email">Email address</label>
          <input id="reg-email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reg-class">Class</label>
          <select id="reg-class" required>
            <option value="">Select class…</option>
            <option value="SS1">SS1</option>
            <option value="SS2">SS2</option>
            <option value="SS3">SS3</option>
          </select>
        </div>
        <div class="field">
          <label for="reg-password">Password <small>(min 6 characters)</small></label>
          <input id="reg-password" type="password" autocomplete="new-password" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reg-submit">CREATE ACCOUNT</button>
        <p style="font-size:.78rem;color:var(--grey-600);margin-top:var(--sp-3)">
          By creating an account you agree to Scholar's Camp Terms & Privacy Policy.
        </p>
      </form>
    </div>
  </main>

  <div id="toast-container"></div>

  <script type="module">
    import { login, registerStudent, resetPassword, roleHome } from "/js/auth.js";
    import { users } from "/js/db.js";
    import { toast, setLoading } from "/js/ui.js";
    import { auth } from "/js/firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // If already signed in, go straight to correct home
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const profile = await users.get(user.uid);
      if (profile) window.location.replace(roleHome(profile.role));
    });

    // Tabs
    const tabs = document.querySelectorAll(".auth-tabs button");
    const panels = { login: document.getElementById("login-form"), register: document.getElementById("register-form") };
    tabs.forEach(t => t.addEventListener("click", () => {
      tabs.forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      Object.values(panels).forEach(p => p.classList.remove("active"));
      panels[t.dataset.tab].classList.add("active");
    }));

    // ?mode=register → open register tab
    if (new URLSearchParams(location.search).get("mode") === "register") {
      tabs[1].click();
    }

    // Login
    const loginForm = document.getElementById("login-form");
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const btn = document.getElementById("login-submit");

      if (!email || !password) return toast("Please fill in email and password.", "error");

      setLoading(btn, true, "Signing in…");
      try {
        const user = await login(email, password);
        const profile = await users.get(user.uid);
        toast(`Welcome back, ${profile?.fullName || user.email}!`, "success");
        setTimeout(() => window.location.replace(roleHome(profile?.role)), 400);
      } catch (err) {
        toast(humanAuthError(err), "error", "Login failed");
        setLoading(btn, false);
      }
    });

    // Register
    const regForm = document.getElementById("register-form");
    regForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullName = document.getElementById("reg-name").value.trim();
      const email    = document.getElementById("reg-email").value.trim();
      const cls      = document.getElementById("reg-class").value;
      const password = document.getElementById("reg-password").value;
      const btn      = document.getElementById("reg-submit");

      if (!fullName || !email || !cls || password.length < 6)
        return toast("Please complete every field (password ≥ 6 characters).", "error");

      setLoading(btn, true, "Creating account…");
      try {
        await registerStudent({ email, password, fullName, studentClass: cls });
        toast("Account created. Welcome to Scholar's Camp!", "success");
        setTimeout(() => window.location.replace("/dashboard.html"), 500);
      } catch (err) {
        toast(humanAuthError(err), "error", "Registration failed");
        setLoading(btn, false);
      }
    });

    // Forgot password
    document.getElementById("forgot-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      if (!email) return toast("Enter your email above, then click Forgot password.", "warn");
      try {
        await resetPassword(email);
        toast("Password reset link sent. Check your inbox.", "success");
      } catch (err) {
        toast(humanAuthError(err), "error");
      }
    });

    function humanAuthError(err) {
      const map = {
        "auth/invalid-email":           "That email address is not valid.",
        "auth/user-not-found":          "No account exists with that email.",
        "auth/wrong-password":          "Incorrect password.",
        "auth/invalid-credential":      "Incorrect email or password.",
        "auth/email-already-in-use":    "That email is already registered.",
        "auth/weak-password":           "Password too weak — use at least 6 characters.",
        "auth/too-many-requests":       "Too many attempts. Please wait and try again.",
        "auth/network-request-failed":  "Network error. Check your internet connection."
      };
      return map[err.code] || err.message || "Something went wrong.";
    }
  </script>
</body>
</html>
